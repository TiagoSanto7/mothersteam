name: Deploy VPS (donos)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps-donos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ELEVENLABS_AGENT_ID: ${{ secrets.VITE_ELEVENLABS_AGENT_ID }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend (git pull + rebuild container)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/mothersteam
            git fetch origin main
            git merge --ff-only origin/main
            cd deploy
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml up -d api
          '

      - name: Deploy frontend (scp dist/)
        run: |
          scp -i ~/.ssh/deploy_key -r dist/. "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/mothersteam/"
