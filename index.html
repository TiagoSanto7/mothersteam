      /* iOS: prevent input focus zoom — computed font-size MUST be >= 16px.
         Using 17px because some iOS versions still zoom at exactly 16px. */
      html, body { -webkit-text-size-adjust: 100%; }
      input:not([type="checkbox"]):not([type="radio"]),
      textarea,
      select {
        font-size: 17px !important;
      }
