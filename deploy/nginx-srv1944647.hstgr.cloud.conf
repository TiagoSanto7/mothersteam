# /etc/nginx/sites-available/srv1944647.hstgr.cloud
# Serve frontend (SPA) + proxia API Fastify (porta 3001) no mesmo hostname.
# HTTPS via Let's Encrypt (certbot).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srv1944647.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1944647.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1944647.hstgr.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    access_log /var/log/nginx/mothersteam.access.log;
    error_log  /var/log/nginx/mothersteam.error.log;

    # Rotas da API → Fastify em 127.0.0.1:3001
    location ~* ^/(auth|users|communities|posts|chats|routine|baby|notifications|search|uploads|admin|products|wishlist|sara|mae-ia|health|sse)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # SSE / streaming exigem conexão longa sem buffer
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    # Frontend SPA (React) — tudo mais vai para index.html
    location / {
        root       /var/www/mothersteam;
        try_files  $uri /index.html;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name srv1944647.hstgr.cloud;
    return 301 https://$host$request_uri;
}
